name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "V*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python for ONNX Runtime assets
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Prepare verified ONNX Runtime assets
        shell: pwsh
        run: |
          python -m pip download onnxruntime==1.24.3 --only-binary=:all: --no-deps --dest runtime-package
          $wheel = Get-ChildItem runtime-package -Filter "*.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "ONNX Runtime wheel was not downloaded."
          }
          Copy-Item $wheel.FullName runtime-package/onnxruntime.zip
          Expand-Archive runtime-package/onnxruntime.zip runtime-package/extracted

          New-Item -ItemType Directory -Force runtime-assets | Out-Null
          $expected = @{
            "onnxruntime.dll" = "E6ABE8B3FE7EB38E0424FA366EB7EDAC2090AC2D211592C26D674F928B44F785"
            "onnxruntime_providers_shared.dll" = "1647771B4593C729DF99A4A86E66AAD6A77C9E6E3C8EFD97322EF42EF9B1CC0B"
          }
          foreach ($name in $expected.Keys) {
            $source = Get-ChildItem runtime-package/extracted -Recurse -Filter $name | Select-Object -First 1
            if (-not $source) {
              throw "Missing $name in the official ONNX Runtime wheel."
            }
            $actual = (Get-FileHash $source.FullName -Algorithm SHA256).Hash
            if ($actual -ne $expected[$name]) {
              throw "Unexpected SHA-256 for ${name}: $actual"
            }
            Copy-Item $source.FullName (Join-Path runtime-assets $name)
          }

      - name: Extract release notes
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^(?i:v\d+\.\d+\.\d+)$') {
            throw "Release tag must look like V0.1.0 or v0.1.0, got '$tag'."
          }

          $lines = Get-Content -Path changelog.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\s*##\s+' -and ($lines[$i] -replace '^\s*##\s+', '').Trim() -ieq $tag) {
              $start = $i
              break
            }
          }
          if ($start -lt 0) {
            throw "No changelog section found for '$tag'."
          }

          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\s*##\s+') {
              $end = $i
              break
            }
          }

          $body = [System.Collections.Generic.List[string]]::new()
          for ($i = $start + 1; $i -lt $end; $i++) {
            $body.Add($lines[$i])
          }
          while ($body.Count -gt 0 -and [string]::IsNullOrWhiteSpace($body[0])) {
            $body.RemoveAt(0)
          }
          while ($body.Count -gt 0 -and [string]::IsNullOrWhiteSpace($body[$body.Count - 1])) {
            $body.RemoveAt($body.Count - 1)
          }
          if ($body.Count -eq 0) {
            throw "Changelog section for '$tag' is empty."
          }

          $notes = $body -join [Environment]::NewLine
          "body<<__CHANGELOG__" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "__CHANGELOG__" >> $env:GITHUB_OUTPUT

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Upload ONNX Runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            runtime-assets/onnxruntime.dll `
            runtime-assets/onnxruntime_providers_shared.dll `
            --clobber

      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
