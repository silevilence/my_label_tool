name: Lua script host
on:
  push:
    paths: ['src-tauri/script-host/**', 'src/lib/defaults/script-limits.json', 'examples/scripts/**', 'containers/script-host.Dockerfile', '.github/workflows/script-host.yml']
  pull_request:
    paths: ['src-tauri/script-host/**', 'src/lib/defaults/script-limits.json', 'examples/scripts/**', 'containers/script-host.Dockerfile', '.github/workflows/script-host.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path src-tauri/script-host/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/script-host/Cargo.toml --all-targets -- -D warnings
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f containers/script-host.Dockerfile -t label-script-host .
      - shell: pwsh
        run: ./scripts/verify-script-host.ps1 -Container -Engine docker -Image label-script-host
